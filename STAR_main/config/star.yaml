      target_treat_rate:
      positive_dose_mean:

      treatment_rho:
      dose_rho:

  treatment_outcomes_influence:
    y1:
      -y1 name

model:
  name: STAR
  star:
    _target_: src.models.star_mechanism.STAR

    min_seq_length:
    max_seq_length:

    seq_hidden_units:
    hr_size:
    fc_hidden_units:
    dropout_rate:

    num_layer: 1
    num_heads: 2
    max_grad_norm: 1.0
    batch_size: 384

    attn_dropout: true
    disable_cross_attention: false
    isolate_subnetwork: _

    self_positional_encoding:
      absolute: false
      trainable: true
      max_relative_position: 15

    optimizer:
      optimizer_cls: adam
      learning_rate: 0.0005
      weight_decay: 0.001
      lr_scheduler: true

    tune_hparams: false
    tune_range: 50
    hparams_grid:
    resources_per_trial:

    plan_encoder_type:
    plan_hidden_dim:
    plan_refine_num_heads:
    plan_refine_dropout:
    plan_refine_gate_bias:
    plan_refine_residual_scale:
    use_plan_conditioning:
    use_plan_head_architecture:
    history_plan_interaction:
    film_enabled:
    stagewise_pair_contrast_loss_weight:
    stagewise_centered_heterogeneity_loss_weight:
    stagewise_training:
    stagewise_terminal_epochs:
    stagewise_epochs_per_head:

    stagewise_require_full_schedule:
    stagewise_stop_after_schedule:

    stagewise_adaptive_history_enabled:
    stagewise_history_lr_scale:
    stagewise_history_anchor_weight:
    stagewise_log_history_drift:

    mechanism:
      enabled:
      output_dir:
      run_id:
      strategy:
      seed:
      every_n_steps:
      probe_size:
      probe_cache_path:

